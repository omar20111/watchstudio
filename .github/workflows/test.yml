name: test and deploy

# Every push and pull request is tested and built. A push to main also publishes
# the built single-file app to GitHub Pages — see "Publish online" in README.md
# for the one-time repository setting this needs.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vite 8 needs Node 20.19+; Node 20 itself is end-of-life, so use 22 LTS
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # dist/ is one self-contained index.html, so it can be served from any path
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The browser checks (e2e/): the built app driven in Chrome with software
  # WebGL. They are the only checks that see the watch drawn, so a push to main
  # is published only once every group has passed (deploy, below). All in one
  # job they had grown past its 45 minutes and were cancelled, so they run in
  # groups side by side, each a job with its own time limit; one group failing
  # does not stop the rest. The groups are sized so no one of them keeps the
  # deploy waiting much past a quarter of an hour.
  e2e:
    name: e2e (${{ matrix.suites }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suites:
          - editor
          - photo,techpack
          - welcome,markers,partstudio,crystal
          - movement,night,touch
          - logo,ar,glb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          E2E_CHANNEL: chrome
          E2E_ONLY: ${{ matrix.suites }}

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # never cancel a deployment half-way; queue the next one behind it
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
